<!doctype html><html><head><meta charset="utf-8"><title>banner</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Trirong:wght@300&family=Archivo:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;width:1600px;height:480px;background:#F7F2E9;color:#40301D;
display:flex;flex-direction:column;align-items:center;justify-content:center;
font-family:Archivo,sans-serif;position:relative;overflow:hidden}
.rule{position:absolute;left:0;right:0;height:1px;background:#E0D6C4}
.eyebrow{display:inline-flex;align-items:center;gap:16px;font-size:20px;letter-spacing:.5em;
text-transform:uppercase;color:#8A6A11;margin:0 0 26px;font-weight:500}
.eyebrow::before,.eyebrow::after{content:"";width:48px;height:1px;background:#C9A227}
h1{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:124px;line-height:1;margin:0}
h1 .script{font-family:Trirong,serif;font-weight:300;font-size:106px;color:#8A6A11;padding-right:18px}
h1 .pro{font-family:Archivo,sans-serif;font-weight:400;font-size:34px;letter-spacing:.34em;
text-indent:.34em;text-transform:uppercase;vertical-align:middle;color:#8A6A11;padding-left:26px}
.sub{margin:30px 0 0;font-size:17px;letter-spacing:.04em;color:#7A6A52}
</style></head><body>
<div class="rule" style="top:64px"></div>
<p class="eyebrow">The Pro Edition</p>
<h1><span class="script">พร้อม</span> Design<span class="pro">Pro</span></h1>
<p class="sub">The working loop, the token systems, and an audit that verifies its own findings.</p>
<div class="rule" style="bottom:64px"></div>
